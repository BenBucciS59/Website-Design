<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media | Benjamin Bucci</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function hoverNavigate(page) {
            const currentPage =
                window.location.pathname.split('/').pop();

            if (currentPage !== page) {
                window.location.href = page;
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>Ben Bucci</h1>
        <nav>
            <a href="index.html" onmouseover="hoverNavigate('index.html')">Home</a>
            <a href="about.html" onmouseover="hoverNavigate('about.html')">About</a>
            <a href="media.html" onmouseover="hoverNavigate('media.html')">Media</a>
            <a href="contact.html" onmouseover="hoverNavigate('contact.html')">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Media</h2>

        <iframe
            style="aspect-ratio: 9 / 16; width: 30%; max-width: 600px;"
            src="https://www.youtube.com/embed/1nlfOlRbjDc"
            title="YouTube Short"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <iframe
            style="aspect-ratio: 9 / 16; width: 30%; max-width: 600px;"
            src="https://www.youtube.com/embed/r1VOt_31Fmc"
            title="YouTube Short"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <iframe
            style="aspect-ratio: 9 / 16; width: 30%; max-width: 600px;"
            src="https://www.youtube.com/embed/lL580sWcziU"
            title="YouTube Short"
            frameborder="0"
            allowfullscreen>
        </iframe>

    </main>

</body>
</html>
